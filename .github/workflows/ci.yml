name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest
      - name: Hostile Corpus Smoke
        run: gbc validate hostile --output-dir evidence/v0.1-validation
      - name: Reproducibility Smoke
        run: gbc validate reproducibility --cases 25 --runs 2 --output-dir evidence/v0.1-validation

