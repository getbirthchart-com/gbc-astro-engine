name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  GBC_SWISS_EPHE_PATH: ${{ github.workspace }}/.ephemeris/swiss
  GBC_JPL_EPHEMERIS_PATH: ${{ github.workspace }}/.ephemeris/jpl/de440s.bsp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Swiss Ephemeris data is not committed: it carries redistribution terms.
      # Without it the suite still passes, but the Swiss golden tests and the
      # geometry gate skip, which would make this workflow green while proving
      # nothing about the real calculation path.
      # GitHub Actions caches are immutable. A static key that once stored
      # incomplete files will keep restoring them. Hash the workflow so the
      # cache invalidates when the fetch instructions change, and use v2 so
      # the previous incomplete v1 entry is not reused.
      - name: Cache ephemeris data
        id: ephe-cache
        uses: actions/cache@v4
        with:
          path: .ephemeris
          key: ephe-swiss18-de440s-v2-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ephe-swiss18-de440s-v2-

      # DE440S is needed by the lunar-node reference tests, not only by the
      # weekly validation workflow. Without it those tests would skip, and the
      # skip guard below turns that into a failure rather than a quiet pass.
      # Fetch any missing or empty files even on a cache hit, so a restored
      # incomplete cache cannot skip the download.
      - name: Fetch ephemeris data
        run: |
          mkdir -p .ephemeris/swiss .ephemeris/jpl
          base=https://raw.githubusercontent.com/aloistr/swisseph/master/ephe
          for file in sepl_18.se1 semo_18.se1 seas_18.se1; do
            dest=".ephemeris/swiss/$file"
            if [ ! -s "$dest" ]; then
              curl -fsSL -o "$dest" "$base/$file"
            fi
          done
          if [ ! -s .ephemeris/jpl/de440s.bsp ]; then
            curl -fsSL -o .ephemeris/jpl/de440s.bsp \
              https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp
          fi

      - name: Install
        run: python -m pip install -e ".[dev,validation]"

      - name: Assert ephemeris data is actually present
        run: |
          for file in sepl_18.se1 semo_18.se1 seas_18.se1; do
            test -s "$GBC_SWISS_EPHE_PATH/$file" || {
              echo "Missing $file: the suite would skip the tests that matter."
              exit 1
            }
          done
          test -s "$GBC_JPL_EPHEMERIS_PATH" || {
            echo "Missing de440s.bsp: the node reference tests would skip."
            exit 1
          }
          # `test -s` accepts an HTML error page. Reject downloads that are
          # far smaller than the real Swiss files before pytest spends a minute
          # turning that into 26 HTTP 503s.
          python - <<'PY'
          import os
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timezone
          from pathlib import Path

          swiss = Path(os.environ["GBC_SWISS_EPHE_PATH"])
          minimums = {
              "sepl_18.se1": 400_000,
              "semo_18.se1": 1_000_000,
              "seas_18.se1": 200_000,
          }
          for name, minimum in minimums.items():
              size = (swiss / name).stat().st_size
              if size < minimum:
                  raise SystemExit(
                      f"{name} is {size} bytes; expected at least {minimum}. "
                      "The download is truncated or not a Swiss Ephemeris file."
                  )

          from gbc_astro.providers.swiss import SwissEphemerisProvider

          provider = SwissEphemerisProvider(ephemeris_path=str(swiss))
          instant = datetime(1992, 11, 3, 7, 35, tzinfo=timezone.utc)
          sun = ThreadPoolExecutor(max_workers=1).submit(
              provider.position, "sun", instant
          ).result()
          print(f"swiss_ok sun={sun.longitude_deg:.6f} from worker thread")

          from fastapi.testclient import TestClient
          from gbc_astro.api.app import create_app

          natal = {
              "local_date": "1992-11-03",
              "local_time": "14:35:00",
              "timezone": "Asia/Ho_Chi_Minh",
              "latitude": 21.0285,
              "longitude": 105.8542,
          }
          with TestClient(create_app()) as client:
              response = client.post("/v1/charts/natal", json=natal)
          if response.status_code != 200:
              raise SystemExit(f"natal HTTP {response.status_code}: {response.text}")
          print("natal_http_ok")
          PY

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      # A skip here means an environment problem, not an excused test: with the
      # ephemeris data and validation extras present the whole suite must run.
      - name: Pytest (no skips allowed)
        run: |
          set -o pipefail
          pytest -q -rs 2>&1 | tee /tmp/pytest.txt
          if grep -qi "skipped" /tmp/pytest.txt; then
            echo "::error::Tests were skipped; CI must run the full suite."
            grep "SKIPPED" /tmp/pytest.txt || true
            exit 1
          fi

      - name: Hostile Corpus Smoke
        run: gbc validate hostile --output-dir evidence/v0.1-validation

      - name: Reproducibility Smoke
        run: gbc validate reproducibility --cases 25 --runs 2 --output-dir evidence/v0.1-validation

      - name: Geometry Parity Gate
        run: gbc validate geometry-parity --cases 120 --seed 42 --output-dir evidence/v0.1-validation

      - name: Chiron Parity Gate
        run: gbc validate chiron-parity --output-dir evidence/v0.1-validation

      - name: House System Gate
        run: gbc validate house-systems --cases 24 --output-dir evidence/v1.0-house-systems

      - name: Ayanamsa Parity Gate
        run: gbc validate ayanamsa-parity --output-dir evidence/v1.0-sidereal

      # A gate nobody runs is not a gate. This has already slipped twice, so the
      # check is mechanical rather than remembered.
      - name: Assert every validation gate is covered
        run: python tools/check_gate_coverage.py
